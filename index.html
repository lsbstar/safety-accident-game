<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전사고 카드 뒤집기 게임</title>
<style>
  :root {
    --navy: #1c2b45;
    --navy-deep: #121d30;
    --amber: #f2b705;
    --amber-soft: #fde6a0;
    --mint: #4fb286;
    --coral: #e2664f;
    --paper: #f6f3ec;
    --ink: #1c2b45;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy-deep);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--paper);
    min-height: 100vh;
  }

  .stage {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 40px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 3px solid var(--amber);
    padding-bottom: 18px;
    margin-bottom: 26px;
  }

  h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0;
    color: var(--amber-soft);
    font-size: 17px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .turn-box {
    background: var(--navy);
    border: 2px solid var(--amber);
    border-radius: 14px;
    padding: 10px 18px;
    text-align: center;
    min-width: 150px;
  }

  .turn-box .label {
    font-size: 13px;
    color: var(--amber-soft);
    margin-bottom: 2px;
  }

  .turn-box .value {
    font-size: 24px;
    font-weight: 700;
  }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  button:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--amber);
    color: var(--navy-deep);
  }

  .btn-secondary {
    background: transparent;
    border: 2px solid var(--paper);
    color: var(--paper);
  }

  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 700;
    background: var(--navy);
    border: 2px solid var(--paper);
    border-radius: 14px;
    padding: 8px 18px;
    min-width: 100px;
    text-align: center;
  }

  .timer.low { border-color: var(--coral); color: var(--coral); }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  @media (max-width: 700px) {
    .board { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    aspect-ratio: 4 / 3;
    perspective: 900px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    overflow: hidden;
    text-align: center;
  }

  .card-back {
    background: var(--navy);
    border: 2px solid var(--amber-soft);
    font-size: 30px;
    color: var(--amber-soft);
  }

  .card-front {
    background: var(--paper);
    color: var(--ink);
    transform: rotateY(180deg);
    flex-direction: column;
    font-weight: 700;
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: white;
  }

  .card-front .word {
    font-size: 19px;
    padding: 10px;
  }

  .card.matched .card-front {
    box-shadow: inset 0 0 0 4px var(--mint);
  }

  .card.matched .card-front .word {
    background: var(--mint);
    color: white;
    width: 100%;
  }

  .card.wrong .card-front {
    box-shadow: inset 0 0 0 4px var(--coral);
  }

  .card.wrong .card-front .word {
    background: var(--coral);
    color: white;
    width: 100%;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: var(--mint);
    color: white;
    padding: 16px 26px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    max-width: 90%;
    text-align: center;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 10;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .progress {
    margin-top: 20px;
    text-align: center;
    color: var(--amber-soft);
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div>
      <h1>안전사고 카드 뒤집기 게임</h1>
      <p class="subtitle">형태와 원인, 한 쌍씩 짚어봐요</p>
    </div>
    <div class="controls">
      <div class="turn-box">
        <div class="label">이번 순서</div>
        <div class="value" id="turnValue">1번째 학생</div>
      </div>
      <div class="timer" id="timer">5:00</div>
      <button class="btn-primary" id="startBtn">시작</button>
      <button class="btn-secondary" id="nextBtn">다음 학생</button>
      <button class="btn-secondary" id="resetBtn">다시 섞기</button>
    </div>
  </header>

  <div class="board" id="board"></div>

  <p class="progress" id="progress">맞춘 짝: 0 / 6</p>
</div>

<div class="toast" id="toast"></div>

];

const board = document.getElementById("board");
const turnValue = document.getElementById("turnValue");
const timerEl = document.getElementById("timer");
const progressEl = document.getElementById("progress");
const toastEl = document.getElementById("toast");

let turnCount = 1;
let matchedCount = 0;
let flipped = [];
let locked = false;
let timeLeft = 300;
let timerHandle = null;

function shuffledCards() {
  const cards = [];
  pairs.forEach((p, i) => {
    cards.push({ pairId: i, face: "img", img: p.img, type: p.type, cause: p.cause });
    cards.push({ pairId: i, face: "word", img: p.img, type: p.type, cause: p.cause });
  });
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function buildBoard() {
  board.innerHTML = "";
  matchedCount = 0;
  flipped = [];
  locked = false;
  progressEl.textContent = `맞춘 짝: 0 / ${pairs.length}`;

  const cards = shuffledCards();
  cards.forEach((c) => {
    const cardEl = document.createElement("div");
    cardEl.className = "card";
    cardEl.dataset.pairId = c.pairId;
    cardEl.dataset.face = c.face;

    const frontHtml = c.face === "img"
      ? `<img src="${c.img}" alt="${c.type}">`
      : `<span class="word">${c.type}</span>`;

    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">?</div>
        <div class="card-face card-front">${frontHtml}</div>
      </div>`;

    cardEl.addEventListener("click", () => handleFlip(cardEl, c));
    board.appendChild(cardEl);
  });
}

function handleFlip(cardEl, data) {
  if (locked || cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;
  if (!timerHandle) startTimer();

  cardEl.classList.add("flipped");
  flipped.push({ cardEl, data });

  if (flipped.length === 2) {
    locked = true;
    const [a, b] = flipped;
    if (a.data.pairId === b.data.pairId) {
      setTimeout(() => {
        a.cardEl.classList.add("matched");
        b.cardEl.classList.add("matched");
        matchedCount++;
        progressEl.textContent = `맞춘 짝: ${matchedCount} / ${pairs.length}`;
        showToast(`${a.data.type} — 원인: ${a.data.cause}`);
        flipped = [];
        locked = false;
      }, 350);
    } else {
      a.cardEl.classList.add("wrong");
      b.cardEl.classList.add("wrong");
      setTimeout(() => {
        a.cardEl.classList.remove("flipped", "wrong");
        b.cardEl.classList.remove("flipped", "wrong");
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

function startTimer() {
  timerHandle = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      timeLeft = 0;
      clearInterval(timerHandle);
      timerHandle = null;
      showToast("시간 종료! 맞춘 짝을 같이 정리해요");
    }
    renderTimer();
  }, 1000);
}

function renderTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = String(timeLeft % 60).padStart(2, "0");
  timerEl.textContent = `${m}:${s}`;
  timerEl.classList.toggle("low", timeLeft <= 30);
}

document.getElementById("nextBtn").addEventListener("click", () => {
  turnCount++;
  turnValue.textContent = `${turnCount}번째 학생`;
});

document.getElementById("startBtn").addEventListener("click", () => {
  if (!timerHandle && timeLeft > 0) startTimer();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  clearInterval(timerHandle);
  timerHandle = null;
  timeLeft = 300;
  turnCount = 1;
  turnValue.textContent = "1번째 학생";
  renderTimer();
  buildBoard();
});

buildBoard();
renderTimer();
</script>
